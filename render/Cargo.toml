[package]
name = "anend-render"
version = "0.1.0"
edition = "2024"
description = "The space drawn on wgpu: blocks, texts, wires and the sky, the same on the desktop and (WebGPU) the web"

[dependencies]
wgpu = "30"
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
ab_glyph = "0.2"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

# the web's canvas (WebGPU)
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
