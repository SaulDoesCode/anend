<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#404040">
<title>anend</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="early.js"></script>
</head>
<body>
<header id="top" class="bar">
  <a id="mark" href="#/editor" aria-label="anend: the editor"><img src="icon.svg" alt="" width="22" height="22"></a>
  <nav id="tabs" aria-label="views"></nav>
  <div id="searchline" hidden></div>
  <span class="grow"></span>
  <span id="status" role="status" aria-live="polite"></span>
  <button id="settings-button" type="button">settings</button>
</header>
<main id="views"></main>
<footer id="dock">
  <div id="bar-right" hidden></div>
  <div id="bar" class="bar">
    <label id="bar-name" for="bar-input">notes</label>
    <input id="bar-input" type="text" autocomplete="off" spellcheck="false" aria-label="command bar">
  </div>
</footer>
<div id="settings" class="overlay" hidden></div>
<noscript><p style="padding:20px">the app needs javascript</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
