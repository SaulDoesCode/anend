[package]
name = "anend-hub"
version = "0.1.0"
edition = "2024"
description = "the anend hub: a self-hosted place to share anend saves"
license-file = "../LICENSE"
publish = false

[dependencies]
salvo = { version = "1.0", default-features = false, features = ["server", "http1", "cookie", "fix-http1-request-uri", "test"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "signal"] }
redb = "4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
askama = "0.16"
argon2 = "0.6"
rand = "0.9"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
