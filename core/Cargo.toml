[package]
name = "anend-core"
version = "0.1.0"
edition = "2024"
description = "anend's saves: notes, memories, gematria search, lists, the forge"
license-file = "../LICENSE"
publish = false

[dependencies]
chrono = "0.4"
redb = "4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
pulldown-cmark = { version = "0.13", default-features = false }
# the GPU compute backend (classify::gpu), off by default so the default build and
# wasm stay std only; `cargo test -p anend-core --features gpu`
wgpu = { version = "30", optional = true }
pollster = { version = "0.4", optional = true }

[features]
gpu = ["dep:wgpu", "dep:pollster"]

[[example]]
name = "gpu_bench"
required-features = ["gpu"]

# pictures (`ops::pictures`): decoding, checking and thumbnails of PNG and JPEG; not in
# the browser build, which reaches pictures through the hub
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
