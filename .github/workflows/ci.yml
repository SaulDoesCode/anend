name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: app and hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwebkit2gtk-4.1-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: the Dioxus app builds for the web too
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p anend-app --target wasm32-unknown-unknown --no-default-features --features web
